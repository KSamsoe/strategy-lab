# Offline demo of the GovGreed strategy against the synthetic adapter.
#
#   lab demo                                    # sets this up for you
#   lab backtest strategies/govgreed_signals.py --config cfg/govgreed_synthetic.yaml
#
# THIS IS NOT A RESULT. The signals here are generated by
# lab/adapters/synthetic.py -- random events with a realistic disclosure lag and
# a deliberately small built-in edge. Its only jobs are to prove the plumbing
# works with no credentials and to make the look-ahead barrier observable: the
# strategy sees each event on its knowledge_time, 6 to 48 days after the trade
# it describes. Any number this config produces describes the generator, not
# the market.

strategy: strategies/govgreed_signals.py
tickers: cfg/universe.txt
timeframe: 1d
start: 2018-06-01
cash: 100000
benchmark: SPY

sources:
  - synthetic

params:
  source: synthetic
  # The synthetic adapter names its event kinds after the real-world artifacts
  # they stand in for; map them onto the three roles the strategy needs.
  kind_signal: congress_trade      # <- the composite signal
  kind_herd: committee_conflict    # <- corroboration path 1
  kind_insider: insider_trade      # <- corroboration path 2
  min_tier: A
  require_fresh: false             # synthetic marks only ~2% of events fresh
  herd_min_tier: B
  insider_min_score: 0.7           # synthetic scores are 0..1, not the vendor scale
  signal_lookback_days: 10
  target_pct: 0.05
  max_new_per_day: 3
  time_stop_days: 30
  stop_loss_pct: 0.12
  cooldown_days: 5
  exit_on_flip: true

fills:
  mode: next_open
  slippage_bps: 8

limits:
  max_position_pct: 0.05
  max_positions: 8
  max_sector_positions: 2
  max_gross_exposure: 0.80
  max_daily_loss_pct: 0.05
  max_orders_per_day: 12
  min_order_notional: 100

origin: human
notes: "synthetic plumbing demo -- not a performance claim"
