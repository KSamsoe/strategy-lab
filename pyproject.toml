[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-lab"
version = "0.2.0"
description = "A quant research lab a desktop agent can drive over MCP: point-in-time backtesting with the caveat attached to every number"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "duckdb>=1.0",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "alpaca-py>=0.30"]
agent = ["anthropic>=0.40"]
# The MCP server: the lab as a toolset a desktop agent drives, rather than a
# platform that makes its own model calls.
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lab = "lab.cli:main"
lab-mcp = "lab.mcp.server:main"

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
